apiVersion: v1
kind: Service
metadata:
  name: retail-banking-k8s # This should match with deployment yaml
spec:
  selector:
    app: retail-banking-k8s
  ports:
    - protocol: "TCP"
      port: 8080 # The port that the service is running in the cluster
      targetPort: 8080 # The port exposed by the service
  type: NodePort # type of the service
